<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Class Warriors</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1c1e26;
    --muted: #666b7a;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --border: #e3e5ec;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151c;
      --card: #1e2029;
      --text: #eceef4;
      --muted: #9aa0b4;
      --accent: #6366f1;
      --accent-hover: #7476f3;
      --border: #2c2f3a;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  #screen-class.card {
    max-width: 800px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  input[type="text"].code-input {
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 600;
  }
  button {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.secondary:hover { background: var(--border); }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
    margin: 20px 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .error {
    color: var(--danger);
    font-size: 13px;
    margin: -8px 0 14px;
    min-height: 16px;
  }
  .hidden { display: none !important; }

  /* --- in-class top bar --- */
  .lobby-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  .code-display .label {
    color: var(--muted);
    font-size: 12px;
  }
  .code-display .code {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--accent);
    margin: 2px 0;
    cursor: pointer;
  }
  .copy-hint {
    font-size: 11px;
    color: var(--muted);
  }
  .lobby-header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  .count {
    color: var(--muted);
    font-size: 13px;
  }
  .top-btn {
    width: auto;
    padding: 8px 14px;
    font-size: 13px;
    margin-bottom: 0;
  }

  /* --- lobby: Habitica-style pixel-art grass ground --- */
  .lobby {
    position: relative;
    width: 100%;
    aspect-ratio: 1000 / 600;
    background-color: #6aa84f;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%20shape-rendering%3D%27crispEdges%27%3E%3Crect%20width%3D%2716%27%20height%3D%2716%27%20fill%3D%27%236aa84f%27%2F%3E%3Crect%20x%3D%279%27%20y%3D%277%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%235c9944%27%2F%3E%3Crect%20x%3D%2713%27%20y%3D%2710%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%235c9944%27%2F%3E%3Crect%20x%3D%272%27%20y%3D%278%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%235c9944%27%2F%3E%3Crect%20x%3D%274%27%20y%3D%279%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%235c9944%27%2F%3E%3Crect%20x%3D%2713%27%20y%3D%277%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%235c9944%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%2714%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%235c9944%27%2F%3E%3Crect%20x%3D%2711%27%20y%3D%274%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%235c9944%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%278%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%235c9944%27%2F%3E%3Crect%20x%3D%2710%27%20y%3D%279%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%235c9944%27%2F%3E%3Crect%20x%3D%270%27%20y%3D%277%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%235c9944%27%2F%3E%3Crect%20x%3D%2713%27%20y%3D%270%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%234f8a3a%27%2F%3E%3Crect%20x%3D%279%27%20y%3D%270%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%234f8a3a%27%2F%3E%3Crect%20x%3D%274%27%20y%3D%270%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%234f8a3a%27%2F%3E%3Crect%20x%3D%272%27%20y%3D%2712%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%234f8a3a%27%2F%3E%3Crect%20x%3D%278%27%20y%3D%270%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%234f8a3a%27%2F%3E%3Crect%20x%3D%272%27%20y%3D%2713%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%234f8a3a%27%2F%3E%3Crect%20x%3D%277%27%20y%3D%2712%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%234f8a3a%27%2F%3E%3Crect%20x%3D%275%27%20y%3D%277%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%234f8a3a%27%2F%3E%3Crect%20x%3D%270%27%20y%3D%270%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%234f8a3a%27%2F%3E%3Crect%20x%3D%278%27%20y%3D%279%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2382c95a%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%2710%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2382c95a%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%274%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2382c95a%27%2F%3E%3Crect%20x%3D%2711%27%20y%3D%2713%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2382c95a%27%2F%3E%3Crect%20x%3D%278%27%20y%3D%273%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2382c95a%27%2F%3E%3Crect%20x%3D%274%27%20y%3D%274%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2382c95a%27%2F%3E%3Crect%20x%3D%271%27%20y%3D%2710%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2382c95a%27%2F%3E%3Crect%20x%3D%2710%27%20y%3D%2711%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2382c95a%27%2F%3E%3Crect%20x%3D%2714%27%20y%3D%271%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2393d66b%27%2F%3E%3Crect%20x%3D%2715%27%20y%3D%276%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2393d66b%27%2F%3E%3Crect%20x%3D%2715%27%20y%3D%272%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2393d66b%27%2F%3E%3Crect%20x%3D%271%27%20y%3D%270%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2393d66b%27%2F%3E%3Crect%20x%3D%279%27%20y%3D%2714%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%2393d66b%27%2F%3E%3Crect%20x%3D%271%27%20y%3D%2711%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%23f5e663%27%2F%3E%3Crect%20x%3D%2714%27%20y%3D%274%27%20width%3D%271%27%20height%3D%271%27%20fill%3D%27%23f5e663%27%2F%3E%3C%2Fsvg%3E");
    background-repeat: repeat;
    background-size: 64px 64px;
    image-rendering: pixelated;
    border: 4px solid #8a5a2e;
    border-radius: 8px;
    overflow: hidden;
  }
  @media (prefers-color-scheme: dark) {
    .lobby {
      filter: brightness(0.7) saturate(0.85);
    }
  }
  .lobby-hint {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 12px;
    color: var(--muted);
    opacity: 0.85;
    pointer-events: none;
    z-index: 2;
  }
  .lobby-hint kbd {
    display: inline-block;
    background: rgba(128,128,128,0.25);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    margin-right: 2px;
    font-family: inherit;
    font-size: 11px;
  }
  .blob {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .blob:not(.self) {
    transition: left 0.05s linear, top 0.05s linear;
  }
  .blob-name {
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: rgba(0,0,0,0.45);
    padding: 2px 7px;
    border-radius: 6px;
    margin-bottom: 4px;
    white-space: nowrap;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .blob-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.55);
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .blob.self .blob-circle {
    box-shadow: 0 0 0 3px var(--accent), 0 2px 8px rgba(0,0,0,0.35);
  }
  .blob.self .blob-name {
    background: var(--accent);
  }
</style>
</head>
<body>

  <div class="card hidden" id="screen-loading">
    <p class="sub" style="margin:0;">Reconnecting to your class…</p>
  </div>

  <div class="card hidden" id="screen-home">
    <h1>Class Warriors</h1>
    <p class="sub">Open a class and share the code, or join one your friend opened.</p>

    <label for="create-name">Your name</label>
    <input id="create-name" type="text" placeholder="e.g. Alex" maxlength="30" />
    <label for="create-password">Password (optional)</label>
    <input id="create-password" type="password" placeholder="Protects your name in this class" maxlength="100" />
    <label for="create-class-password">Class password (optional)</label>
    <input id="create-class-password" type="password" placeholder="Keeps this whole class from expiring" maxlength="100" />
    <button id="btn-create">Open a class</button>

    <div class="divider">or</div>

    <label for="join-name">Your name</label>
    <input id="join-name" type="text" placeholder="e.g. Alex" maxlength="30" />
    <label for="join-code">Class code</label>
    <input id="join-code" class="code-input" type="text" placeholder="ABCDE" maxlength="5" />
    <label for="join-password">Password (optional)</label>
    <input id="join-password" type="password" placeholder="Only if you set one before" maxlength="100" />
    <div class="error" id="join-error"></div>
    <button id="btn-join" class="secondary">Join class</button>
  </div>

  <div class="card hidden" id="screen-class">
    <div class="lobby-header">
      <div class="code-display">
        <div class="label">Class code — share this with your friend</div>
        <div class="code" id="class-code">-----</div>
        <div class="copy-hint" id="copy-hint">Click the code to copy</div>
        <div class="copy-hint hidden" id="permanent-badge">🔒 Permanent class</div>
      </div>
      <div class="lobby-header-right">
        <div class="count" id="member-count">0 people in this class</div>
        <button class="secondary top-btn" id="btn-leave">Leave class</button>
      </div>
    </div>
    <div class="lobby" id="lobby">
      <div class="lobby-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ transports: ["websocket"] });

    const screenLoading = document.getElementById("screen-loading");
    const screenHome = document.getElementById("screen-home");
    const screenClass = document.getElementById("screen-class");

    // ---- session persistence (survive page reloads) ----
    const SESSION_KEY = "classWarriorsSession";

    function saveSession(code, name, password) {
      try {
        localStorage.setItem(SESSION_KEY, JSON.stringify({ code, name, password: password || "" }));
      } catch (e) {}
    }

    function loadSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function clearSession() {
      try {
        localStorage.removeItem(SESSION_KEY);
      } catch (e) {}
    }

    // A per-browser id (not tied to any one class) so a reload can prove
    // "this is the same browser" and reclaim its name immediately, instead
    // of waiting for the server to notice the old connection is gone.
    const DEVICE_ID_KEY = "classWarriorsDeviceId";
    function getDeviceId() {
      try {
        let id = localStorage.getItem(DEVICE_ID_KEY);
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem(DEVICE_ID_KEY, id);
        }
        return id;
      } catch (e) {
        return "";
      }
    }
    const deviceId = getDeviceId();

    const createName = document.getElementById("create-name");
    const createPassword = document.getElementById("create-password");
    const createClassPassword = document.getElementById("create-class-password");
    const permanentBadge = document.getElementById("permanent-badge");
    const joinName = document.getElementById("join-name");
    const joinCode = document.getElementById("join-code");
    const joinPassword = document.getElementById("join-password");
    const joinError = document.getElementById("join-error");

    const classCodeEl = document.getElementById("class-code");
    const copyHint = document.getElementById("copy-hint");
    const memberCountEl = document.getElementById("member-count");
    const lobbyEl = document.getElementById("lobby");

    // ---- lobby / blob state ----
    let world = { width: 1000, height: 600, radius: 24 };
    let selfName = null;
    const players = new Map(); // name -> { x, y, el }
    const keys = { w: false, a: false, s: false, d: false };
    const SPEED = 260; // world units per second
    const MOVE_SEND_INTERVAL = 33; // ms (~30 updates/sec)
    let lastMoveSent = 0;
    let lastFrameTime = null;
    let rafId = null;

    function normalizeName(v) {
      const t = (v || "").trim().slice(0, 30);
      return t || "Anonymous";
    }

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function colorForName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      return `hsl(${hash % 360}, 65%, 55%)`;
    }

    function positionBlob(el, x, y) {
      el.style.left = (x / world.width) * 100 + "%";
      el.style.top = (y / world.height) * 100 + "%";
    }

    function createBlobEl(name) {
      const el = document.createElement("div");
      el.className = "blob";
      const nameEl = document.createElement("span");
      nameEl.className = "blob-name";
      nameEl.textContent = name;
      const circleEl = document.createElement("span");
      circleEl.className = "blob-circle";
      circleEl.style.background = colorForName(name);
      el.appendChild(nameEl);
      el.appendChild(circleEl);
      lobbyEl.appendChild(el);
      return el;
    }

    function clearLobby() {
      for (const [, p] of players) p.el.remove();
      players.clear();
    }

    function syncMembers(members) {
      const seen = new Set();
      for (const m of members) {
        seen.add(m.name);
        let p = players.get(m.name);
        if (!p) {
          const el = createBlobEl(m.name);
          if (m.name === selfName) el.classList.add("self");
          p = { x: m.x, y: m.y, el };
          players.set(m.name, p);
          positionBlob(el, p.x, p.y);
        } else if (m.name !== selfName) {
          p.x = m.x;
          p.y = m.y;
          positionBlob(p.el, p.x, p.y);
        }
      }
      for (const [name, p] of players) {
        if (!seen.has(name)) {
          p.el.remove();
          players.delete(name);
        }
      }
      memberCountEl.textContent = `${members.length} ${members.length === 1 ? "person" : "people"} in this class`;
    }

    function step(timestamp) {
      if (lastFrameTime == null) lastFrameTime = timestamp;
      const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
      lastFrameTime = timestamp;

      const self = players.get(selfName);
      if (self) {
        let dx = 0, dy = 0;
        if (keys.w) dy -= 1;
        if (keys.s) dy += 1;
        if (keys.a) dx -= 1;
        if (keys.d) dx += 1;
        if (dx || dy) {
          const len = Math.hypot(dx, dy);
          dx /= len;
          dy /= len;
          self.x = clamp(self.x + dx * SPEED * dt, world.radius, world.width - world.radius);
          self.y = clamp(self.y + dy * SPEED * dt, world.radius, world.height - world.radius);
          positionBlob(self.el, self.x, self.y);

          const now = performance.now();
          if (now - lastMoveSent > MOVE_SEND_INTERVAL) {
            lastMoveSent = now;
            socket.emit("move", { x: self.x, y: self.y });
          }
        }
      }
      rafId = requestAnimationFrame(step);
    }

    function startLobbyLoop() {
      if (rafId) return;
      lastFrameTime = null;
      rafId = requestAnimationFrame(step);
    }

    function stopLobbyLoop() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    }

    function setKey(k, val) {
      if (k === "w" || k === "arrowup") keys.w = val;
      else if (k === "s" || k === "arrowdown") keys.s = val;
      else if (k === "a" || k === "arrowleft") keys.a = val;
      else if (k === "d" || k === "arrowright") keys.d = val;
      else return;
    }

    window.addEventListener("keydown", (e) => {
      if (screenClass.classList.contains("hidden")) return;
      const k = e.key.toLowerCase();
      if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) {
        e.preventDefault();
        setKey(k, true);
      }
    });
    window.addEventListener("keyup", (e) => setKey(e.key.toLowerCase(), false));
    window.addEventListener("blur", () => {
      keys.w = keys.a = keys.s = keys.d = false;
    });

    // ---- screens ----
    function showClassScreen(code, members, worldCfg, permanent) {
      screenLoading.classList.add("hidden");
      screenHome.classList.add("hidden");
      screenClass.classList.remove("hidden");
      classCodeEl.textContent = code;
      permanentBadge.classList.toggle("hidden", !permanent);
      if (worldCfg) world = worldCfg;
      clearLobby();
      syncMembers(members);
      startLobbyLoop();
    }

    function showHomeScreen(message) {
      screenLoading.classList.add("hidden");
      screenClass.classList.add("hidden");
      screenHome.classList.remove("hidden");
      joinError.textContent = message || "";
      stopLobbyLoop();
      clearLobby();
      selfName = null;
    }

    document.getElementById("btn-create").addEventListener("click", () => {
      joinError.textContent = "";
      const name = normalizeName(createName.value);
      const password = createPassword.value;
      const classPassword = createClassPassword.value;
      socket.emit("createClass", { name: createName.value, password, classPassword, deviceId }, (res) => {
        if (res.ok) {
          selfName = name;
          saveSession(res.code, name, password);
          showClassScreen(res.code, res.members, res.world, res.permanent);
        } else {
          joinError.textContent = res.error || "Couldn't open a class.";
        }
      });
    });

    document.getElementById("btn-join").addEventListener("click", () => {
      joinError.textContent = "";
      const code = joinCode.value.trim().toUpperCase();
      if (!code) {
        joinError.textContent = "Enter a class code.";
        return;
      }
      const name = normalizeName(joinName.value);
      const password = joinPassword.value;
      socket.emit("joinClass", { code, name: joinName.value, password, deviceId }, (res) => {
        if (res.ok) {
          joinPassword.value = "";
          selfName = name;
          saveSession(res.code, name, password);
          showClassScreen(res.code, res.members, res.world, res.permanent);
        } else {
          joinError.textContent = res.error || "Couldn't join that class.";
        }
      });
    });

    socket.on("kicked", (reason) => {
      clearSession();
      showHomeScreen(reason || "You were disconnected from the class.");
    });

    document.getElementById("btn-leave").addEventListener("click", () => {
      socket.emit("leaveClass");
      clearSession();
      showHomeScreen();
    });

    // ---- auto-rejoin after a page reload ----
    // The matching deviceId lets the server reclaim the name immediately in
    // the common case. The retry loop is just a safety net for the rare
    // case a genuinely different, already-active session holds the name.
    function attemptAutoRejoin(session, retriesLeft) {
      socket.emit(
        "joinClass",
        { code: session.code, name: session.name, password: session.password, deviceId },
        (res) => {
          if (res.ok) {
            selfName = normalizeName(session.name);
            showClassScreen(res.code, res.members, res.world, res.permanent);
          } else if (res.code === "NAME_IN_USE" && retriesLeft > 0) {
            setTimeout(() => attemptAutoRejoin(session, retriesLeft - 1), 600);
          } else {
            clearSession();
            showHomeScreen();
          }
        }
      );
    }

    const savedSession = loadSession();
    if (savedSession && savedSession.code && savedSession.name) {
      screenLoading.classList.remove("hidden");
      attemptAutoRejoin(savedSession, 5);
    } else {
      screenHome.classList.remove("hidden");
    }

    classCodeEl.addEventListener("click", () => {
      navigator.clipboard.writeText(classCodeEl.textContent).then(() => {
        copyHint.textContent = "Copied!";
        setTimeout(() => (copyHint.textContent = "Click the code to copy"), 1500);
      });
    });

    joinCode.addEventListener("input", () => {
      joinCode.value = joinCode.value.toUpperCase();
    });

    socket.on("members", (members) => {
      syncMembers(members);
    });

    socket.on("playerMoved", ({ name, x, y }) => {
      if (name === selfName) return;
      const p = players.get(name);
      if (!p) return;
      p.x = x;
      p.y = y;
      positionBlob(p.el, x, y);
    });
  </script>
</body>
</html>
